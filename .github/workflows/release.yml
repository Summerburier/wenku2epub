name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: wenku2epub-windows-x64.exe
            binary_path: target/release/wenku2epub.exe
          - os: ubuntu-latest
            asset_name: wenku2epub-linux-x64
            binary_path: target/release/wenku2epub
          - os: macos-latest
            asset_name: wenku2epub-macos-arm64
            binary_path: target/release/wenku2epub
          - os: macos-latest
            asset_name: wenku2epub-macos-x64
            binary_path: target/x86_64-apple-darwin/release/wenku2epub
            cross_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross_target }}

      - name: Build
        run: |
          if [ "${{ matrix.cross_target }}" != "" ]; then
            cargo build --release --target ${{ matrix.cross_target }}
          else
            cargo build --release
          fi
        shell: bash

      - name: Rename binary to unique asset name
        run: cp ${{ matrix.binary_path }} ${{ matrix.asset_name }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 只把产物追加到网页端手动创建的 release，不自动创建 release
      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" artifacts/* --clobber
